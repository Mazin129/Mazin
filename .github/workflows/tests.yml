name: Vio tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # the suites are deterministic and LLM-free by design — pin the cortex off
      # (the B4 lesson: a live Ollama leaking into a test run turns 40ms cases
      # into minutes)
      VIO_LLM_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        working-directory: AI-Foundation-Model-Design/mind
        run: |
          pip install --upgrade pip
          pip install sympy scikit-learn numpy pandas duckdb
          pip install pymupdf pdfminer.six openpyxl python-docx
          # sentence-transformers deliberately NOT installed: its absence must
          # degrade gracefully (lexical-only retrieval) — CI proves that contract

      - name: Syntax check every module
        working-directory: AI-Foundation-Model-Design/mind
        run: |
          python - <<'PY'
          import ast, glob
          files = [f for f in glob.glob('**/*.py', recursive=True) if 'vendor' not in f]
          for f in files:
              ast.parse(open(f, encoding='utf-8').read())
          print(f'{len(files)} modules parse')
          PY

      - name: Golden gate (correctness + safety + latency)
        working-directory: AI-Foundation-Model-Design/mind
        run: python golden_eval.py

      - name: Capability battery
        working-directory: AI-Foundation-Model-Design/mind
        run: python capability_test.py

      - name: Module guards
        working-directory: AI-Foundation-Model-Design/mind
        run: |
          for t in test_agents test_fixes test_brain test_websearch test_configparse test_configaudit test_selfimprove test_coordinator; do
            echo "::group::$t"
            VIO_DATA_DIR=$(mktemp -d) python $t.py || exit 1
            echo "::endgroup::"
          done
