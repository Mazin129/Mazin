# Vio online — one command deploy: Caddy (TLS) → Vio → Ollama.
#   1. cp .env.example .env  and edit it
#   2. docker compose up -d --build
#   3. docker compose exec ollama ollama pull llama3.1
# Caddy fetches a real Let's Encrypt cert for $DOMAIN automatically.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # ── GPU (optional, much faster) — needs the NVIDIA container toolkit on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - {driver: nvidia, count: 1, capabilities: [gpu]}

  vio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      VIO_TOKEN: ${VIO_TOKEN:?set VIO_TOKEN in .env}      # required — no token, no boot
      VIO_LLM_URL: http://ollama:11434
      VIO_LLM_MODEL: ${VIO_LLM_MODEL:-}                   # blank = auto-pick installed model
      VIO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      VIO_DATA_DIR: /data
    volumes:
      - viodata:/data
    depends_on:
      - ollama

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vio

volumes:
  ollama:
  viodata:
  caddy_data:
  caddy_config:
